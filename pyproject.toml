[project]
name = "custom-harness-development"
version = "0.1.0"
description = "QLoRA fine-tuning of a coder LLM plus a LangGraph SDLC agent harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.7.4",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Needs a CUDA GPU for bitsandbytes (e.g. Kaggle/Colab). Install with: uv sync --extra train
train = [
    "torch",
    "transformers",
    "trl",
    "peft",
    "datasets",
    "accelerate",
    "hf-transfer",
    "bitsandbytes; sys_platform != 'darwin'",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
